# OSV ignores, read by osv-scanner and by OpenSSF Scorecard's Vulnerabilities
# check. Every entry names why it does not apply; re-check it when the module
# graph changes rather than letting it outlive its reason.

[[IgnoredVulns]]
id = "GO-2026-5932"
# golang.org/x/crypto/openpgp is deprecated, and this advisory covers every
# x/crypto version with no fixed release. It is linked only because
# github.com/creativeprojects/go-selfupdate (k4a upgrade) imports it for its
# PGPValidator; k4a configures the ChecksumValidator and never calls the
# OpenPGP code. govulncheck reports it as reachable only through the
# packages' init functions. Revisit when go-selfupdate drops the import or
# k4a replaces it.
reason = "x/crypto/openpgp is linked by go-selfupdate's unused PGP validator; k4a only runs its package init"
