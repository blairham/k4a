apiVersion: v1
kind: Service
metadata:
  name: {{ include "k4a-index.fullname" . }}
  labels:
    {{- include "k4a-index.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "k4a-index.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
