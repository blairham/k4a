apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k4a-index.fullname" . }}
  labels:
    {{- include "k4a-index.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate is safe: the daemon is pure read-only (it never produces, no
  # single-writer requirement), each pod owns its own emptyDir index, and two
  # pods briefly both tailing is harmless. Nothing to fence.
  selector:
    matchLabels:
      {{- include "k4a-index.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k4a-index.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k4a-index.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: k4a-index
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or .Values.kafka.insecure .Values.kafka.noTLS }}
          # --insecure and --no-tls have no env equivalent, so they are passed
          # as arguments.
          args:
            {{- if .Values.kafka.insecure }}
            - --insecure
            {{- end }}
            {{- if .Values.kafka.noTLS }}
            - --no-tls
            {{- end }}
          {{- end }}
          env:
            - name: KAFKA_BROKERS
              value: {{ required "kafka.brokers is required" .Values.kafka.brokers | quote }}
            - name: KAFKA_AUTH
              value: {{ .Values.kafka.auth | quote }}
            {{- with .Values.kafka.credentials.existingSecret }}
            # SASL username/password (scram, scram-sha-256, plain), read from an
            # existing Secret.
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.kafka.credentials.usernameKey }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.kafka.credentials.passwordKey }}
            {{- end }}
            {{- with .Values.kafka.oauth }}
            {{- if .tokenUrl }}
            # OAUTHBEARER client-credentials grant.
            - name: KAFKA_OAUTH_TOKEN_URL
              value: {{ .tokenUrl | quote }}
            {{- end }}
            {{- if .clientId }}
            - name: KAFKA_OAUTH_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .scopes }}
            - name: KAFKA_OAUTH_SCOPES
              value: {{ .scopes | quote }}
            {{- end }}
            {{- if and .existingSecret .clientSecretKey }}
            - name: KAFKA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .clientSecretKey }}
            {{- end }}
            {{- if and .existingSecret .tokenKey }}
            # OAUTHBEARER static token, read from an existing Secret.
            - name: KAFKA_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .tokenKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.kafka.tls.existingSecret }}
            # TLS material, mounted from an existing Secret at /etc/k4a/tls.
            {{- with .Values.kafka.tls.caKey }}
            - name: KAFKA_TLS_CA
              value: /etc/k4a/tls/{{ . }}
            {{- end }}
            {{- with .Values.kafka.tls.certKey }}
            - name: KAFKA_TLS_CERT
              value: /etc/k4a/tls/{{ . }}
            {{- end }}
            {{- with .Values.kafka.tls.keyKey }}
            - name: KAFKA_TLS_KEY
              value: /etc/k4a/tls/{{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.aws.region }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- end }}
            # Follow allowlist (default-deny) — the v1 authorization boundary.
            - name: K4A_INDEX_ALLOW
              value: {{ required "config.allow is required (the follow allowlist is default-deny)" .Values.config.allow | quote }}
            {{- if .Values.config.prefollow }}
            # Pre-follow (pinned) topics warmed at startup.
            - name: K4A_INDEX_TOPIC
              value: {{ .Values.config.prefollow | quote }}
            {{- end }}
            {{- if .Values.config.followSetTopic }}
            # The follow-set shared by every pod and replica (#123).
            - name: K4A_INDEX_FOLLOWSET_TOPIC
              value: {{ .Values.config.followSetTopic | quote }}
            {{- end }}
            - name: K4A_INDEX_MAX_FOLLOWED
              value: {{ .Values.config.maxFollowed | quote }}
            # Per-topic index byte cap — trims oldest records so a high-volume
            # topic can't fill the emptyDir and evict the pod.
            - name: K4A_INDEX_TOPIC_MAX_BYTES
              value: {{ .Values.config.topicMaxBytes | quote }}
            - name: K4A_INDEX_EVICT_AFTER
              value: {{ .Values.config.evictAfter | quote }}
            - name: K4A_INDEX_BACKFILL_WINDOW
              value: {{ .Values.config.backfill.window | quote }}
            - name: K4A_INDEX_BACKFILL_MAX_RECORDS
              value: {{ .Values.config.backfill.maxRecords | int64 | quote }}
            # Whole-index-root disk budget: reclaims orphaned dirs and evicts
            # the coldest topics before the volume fills and the kubelet
            # evicts the pod.
            - name: K4A_INDEX_MAX_TOTAL_BYTES
              value: {{ .Values.config.maxTotalBytes | quote }}
            # Drain-stall watchdog: fail-fast timeout, the in-flight
            # merge grace that keeps the exit from becoming a restart livelock,
            # and the strike count at which the wedged index is quarantined.
            - name: K4A_INDEX_DRAIN_STALL_TIMEOUT
              value: {{ .Values.config.drainStall.timeout | quote }}
            - name: K4A_INDEX_DRAIN_STALL_MERGE_GRACE
              value: {{ .Values.config.drainStall.mergeGrace | quote }}
            - name: K4A_INDEX_DRAIN_STALL_WIPE_AFTER
              value: {{ .Values.config.drainStall.wipeAfter | quote }}
            - name: K4A_INDEX_MAX_SEARCH_LIMIT
              value: {{ .Values.config.maxSearchLimit | quote }}
            {{- if and .Values.listener.tls.clientCAKey (not .Values.listener.tls.existingSecret) }}
            {{- fail "listener.tls.clientCAKey needs listener.tls.existingSecret: mTLS runs over the listener's TLS" }}
            {{- end }}
            {{- with .Values.listener.tls.existingSecret }}
            # gRPC listener TLS (and mTLS when clientCAKey is set).
            - name: K4A_INDEX_TLS_CERT
              value: /etc/k4a/listener-tls/{{ $.Values.listener.tls.certKey }}
            - name: K4A_INDEX_TLS_KEY
              value: /etc/k4a/listener-tls/{{ $.Values.listener.tls.keyKey }}
            {{- with $.Values.listener.tls.clientCAKey }}
            - name: K4A_INDEX_TLS_CLIENT_CA
              value: /etc/k4a/listener-tls/{{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.listener.token.existingSecret }}
            - name: K4A_INDEX_TOKEN_FILE
              value: /etc/k4a/listener-token/{{ $.Values.listener.token.key }}
            {{- end }}
            - name: K4A_INDEX_LISTEN
              value: ":{{ .Values.service.port }}"
            - name: K4A_INDEX_DATA_DIR
              value: /data
            - name: K4A_INDEX_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.metrics.enabled }}
            - name: K4A_INDEX_ADMIN_LISTEN
              value: ":{{ .Values.metrics.port }}"
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          # Probes ask the daemon's grpc.health.v1 service, which reports
          # SERVING once the listener is up (pre-follow done) and NOT_SERVING
          # from SIGTERM on. The kubelet's gRPC probe cannot speak TLS, so a
          # TLS listener is probed through the admin port's /readyz (the same
          # status over plain HTTP), or by TCP when the admin port is off.
          # Warmth is not a gate: a cold topic answers with no coverage and
          # the client scans. A wedged indexing drain is caught by the
          # drain-stall watchdog, which exits the process.
          {{- $probe := dict "grpc" (dict "port" (int .Values.service.port)) }}
          {{- $live := $probe }}
          {{- if .Values.listener.tls.existingSecret }}
          {{- if .Values.metrics.enabled }}
          {{- $probe = dict "httpGet" (dict "path" "/readyz" "port" "metrics") }}
          {{- $live = dict "httpGet" (dict "path" "/healthz" "port" "metrics") }}
          {{- else }}
          {{- $probe = dict "tcpSocket" (dict "port" "grpc") }}
          {{- $live = $probe }}
          {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml $probe | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            {{- toYaml $probe | nindent 12 }}
            periodSeconds: 10
          livenessProbe:
            {{- toYaml $live | nindent 12 }}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: index
              mountPath: /data
            # The root filesystem is read-only; /tmp is the only other
            # writable path.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.kafka.tls.existingSecret }}
            - name: kafka-tls
              mountPath: /etc/k4a/tls
              readOnly: true
            {{- end }}
            {{- if .Values.listener.tls.existingSecret }}
            - name: listener-tls
              mountPath: /etc/k4a/listener-tls
              readOnly: true
            {{- end }}
            {{- if .Values.listener.token.existingSecret }}
            - name: listener-token
              mountPath: /etc/k4a/listener-token
              readOnly: true
            {{- end }}
      volumes:
        # Disposable index storage — rebuilt from the broker on restart.
        - name: index
          emptyDir:
            sizeLimit: {{ .Values.storage.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.storage.tmpSizeLimit }}
        {{- with .Values.kafka.tls.existingSecret }}
        - name: kafka-tls
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.listener.tls.existingSecret }}
        - name: listener-tls
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.listener.token.existingSecret }}
        - name: listener-token
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
