# Default values for k4a-index. Set image.repository/tag to wherever you push
# the `index` target of the repo-root Dockerfile.
#
# 1 replica day one. HA is read-only fan-out replicas (each independently tailing
# the same topics with its own index) — never Raft, because the index is fully
# reconstructable from the broker (docs/design/shared-index-service.md §Availability).
# Bumping replicaCount is the whole HA story; no leadership to elect.
replicaCount: 1

# Resource names default to "<release>-k4a-index", or just the release name
# when it already contains "k4a-index" (so `helm install k4a-index` keeps the
# bare name "k4a-index"). fullnameOverride pins the name outright.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# The ServiceAccount the pod runs as. If the daemon authenticates to Kafka with
# IAM (MSK), bind this name to an IAM role via EKS Pod Identity or IRSA (for
# IRSA, add the role ARN under annotations). Empty name = the chart fullname.
serviceAccount:
  name: ""
  annotations: {}

service:
  # gRPC (Search/Follow/Coverage). The Service is ClusterIP; expose it to
  # clients outside the cluster with an internal LoadBalancer or Ingress that
  # terminates TLS and negotiates ALPN h2 (see docs/guides/deploy.md).
  port: 9500

# Caller authentication on the gRPC listener. Both are off by default, which
# keeps an upgraded install serving plaintext with no caller credential — the
# daemon logs a warning at startup saying so. This authenticates "a caller
# holding the deployment's credential"; it does not authorize per caller, so
# every authenticated caller still reads every followed topic (SECURITY.md).
listener:
  # Serve gRPC over TLS from an existing kubernetes.io/tls Secret, mounted
  # read-only at /etc/k4a/listener-tls. A renewed certificate is picked up
  # without a restart. Clients then dial without index-insecure, trusting this
  # certificate's CA (index-ca, or k4a-mcp's index.tls values).
  tls:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    # Set to a CA key in the same Secret (e.g. ca.crt) to require a client
    # certificate signed by it on every RPC but health checks (mTLS).
    clientCAKey: ""
  # A bearer token every RPC but health checks must present, from an existing
  # Secret mounted at /etc/k4a/listener-token. Read at startup: restart the
  # pod after rotating it. Clients refuse to send it over plaintext, so pair
  # it with listener.tls (or a TLS-terminating load balancer for external
  # clients — then in-cluster k4a-mcp must also go through TLS).
  token:
    existingSecret: ""
    key: token

kafka:
  # Bootstrap servers, comma-separated. Required. Rendered as KAFKA_BROKERS.
  brokers: ""
  # Auth method: plaintext, tls, scram (SHA-512), scram-sha-256, plain,
  # oauthbearer, mtls, iam. Rendered as KAFKA_AUTH.
  # With iam the daemon uses the pod's AWS credentials (Pod Identity / IRSA),
  # so no SASL secret is needed.
  auth: iam
  # Skip TLS certificate verification (--insecure). Testing only.
  insecure: false
  # Run a SASL method (scram, scram-sha-256, plain, oauthbearer) without TLS
  # (--no-tls, SASL_PLAINTEXT). The password or token then crosses the network
  # in cleartext; for an in-cluster development broker only.
  noTLS: false
  # SASL username/password (auth: scram, scram-sha-256, plain) from an existing
  # Secret in the release namespace. Rendered as KAFKA_USERNAME / KAFKA_PASSWORD when set.
  credentials:
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  # OAUTHBEARER (auth: oauthbearer). Either the client-credentials grant
  # (tokenUrl + clientId, with the client secret under clientSecretKey in
  # existingSecret), or a static token under tokenKey in existingSecret. Set
  # one; the daemon refuses both. Rendered as KAFKA_OAUTH_*. extensions
  # ("key=value,key=value", e.g. Confluent Cloud's logicalCluster and
  # identityPoolId) and authzid (act as this principal) apply to either.
  oauth:
    tokenUrl: ""
    clientId: ""
    scopes: ""
    extensions: ""
    authzid: ""
    existingSecret: ""
    clientSecretKey: ""
    tokenKey: ""
  # TLS material (auth: tls, mtls, or a SASL method over TLS) from an existing Secret,
  # mounted read-only at /etc/k4a/tls. Each key that is non-empty becomes the
  # matching file env var: caKey -> KAFKA_TLS_CA, certKey -> KAFKA_TLS_CERT,
  # keyKey -> KAFKA_TLS_KEY. The defaults match a kubernetes.io/tls Secret with
  # a ca.crt added; mtls needs all three, tls needs only a CA (and none at all
  # if the brokers' certificates chain to the system roots — then leave
  # existingSecret empty).
  tls:
    existingSecret: ""
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key

aws:
  # Region for IAM auth. Rendered as AWS_REGION when set; the daemon defaults
  # to us-east-1 otherwise.
  region: ""

# Confluent Schema Registry. With a url, the daemon indexes registry-framed
# Avro, Protobuf and JSON-Schema keys and values as their decoded JSON, and
# serves a client's search only when the client decodes with the same
# registry (its context's schema-registry block): every other search scans.
# Credentials, HTTP basic (usernameKey + passwordKey) or a bearer token
# (tokenKey), come from an existing Secret; set one kind, not both. The
# registry's certificate must chain to the system roots. Rendered as
# K4A_SCHEMA_REGISTRY_*.
schemaRegistry:
  url: ""
  existingSecret: ""
  usernameKey: ""
  passwordKey: ""
  tokenKey: ""

# Rendered as K4A_INDEX_LOG_LEVEL: debug, info, warn, error.
logLevel: info

# On SIGTERM the daemon stops accepting RPCs and drains in-flight ones
# (gRPC GracefulStop); the kubelet kills it after this many seconds.
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532        # distroless nonroot
  runAsGroup: 65532
  fsGroup: 65532          # so the nonroot process can write the emptyDir index
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only: the daemon writes only to the index
# emptyDir (/data) and a small /tmp emptyDir.
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

resources:
  requests:
    # Sized to measured usage, NOT to merge headroom. A stalled-merge wedge is
    # a merger goroutine that has DIED (panic recovered in scorch's mergerLoop),
    # not a CPU-starved one, so there is no merge to give CPU to — a wedged pod
    # draws about the same CPU at a 100m request as at a full core, i.e. it was
    # never throttled. Steady-state draw is roughly 120–670m across a handful
    # of followed topics, so 500m is a realistic request with burst headroom
    # (there is no CPU limit).
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits:
    # 2Gi so a merge of a capped topic has scratch room alongside the resident
    # index; at 1Gi a large merge competes with the very index it is compacting.
    memory: 2Gi
    # Bounds the emptyDir index + scratch. The per-topic byte cap
    # (config.topicMaxBytes) keeps each followed topic's index bounded so the
    # working set stays well under this. Raise with the cap / followed-topic count.
    ephemeral-storage: 12Gi

# Disposable index storage. emptyDir, NOT a PVC: the index is a pure optimization
# that rebuilds from the broker, so index loss is a non-event — on restart the
# daemon re-tails from latest and re-warms (design doc §Storage). sizeLimit caps
# the volume; keep it at/under the ephemeral-storage limit above.
storage:
  sizeLimit: 10Gi
  # The /tmp emptyDir that stands in for the read-only root filesystem.
  tmpSizeLimit: 64Mi

# Prometheus metrics and plain-HTTP health on a separate port
# (K4A_INDEX_ADMIN_LISTEN): /metrics, /healthz, /readyz. It carries topic names
# and counters, never record content, and asks no credential, so keep it to
# the scraper with networkPolicy.metricsFrom.
metrics:
  enabled: true
  port: 9502
  # A prometheus-operator ServiceMonitor for the metrics port. Needs the
  # monitoring.coreos.com CRDs; labels are added to match your Prometheus's
  # serviceMonitorSelector.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Optional NetworkPolicy, default off. Admits ingress to the gRPC port, and to
# the metrics port when metrics are enabled.
networkPolicy:
  enabled: false
  # NetworkPolicyPeer list allowed to reach the gRPC port; empty = any source
  # (still only on that port). A load balancer that targets pod IPs reaches
  # the pod from non-pod addresses, so admit its subnets with an ipBlock, e.g.
  #   ingressFrom:
  #     - podSelector: {matchLabels: {app.kubernetes.io/name: k4a-mcp}}
  #     - ipBlock: {cidr: 10.0.0.0/16}
  ingressFrom: []
  # NetworkPolicyPeer list allowed to reach the metrics port (the Prometheus
  # pods); empty = any source, on that port only.
  metricsFrom: []
  # NetworkPolicyEgressRule list. Empty = egress is not restricted. If you set
  # it, allow DNS, the brokers and, for IAM auth, STS and the credential agent.
  egress: []

# Optional PodDisruptionBudget, default off. With replicaCount 1 and
# minAvailable 1 a node drain blocks until you intervene; that is usually not
# what you want for a disposable index, so raise replicaCount first or use
# maxUnavailable. maxUnavailable wins when set.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

config:
  # Most matches one Search returns. A request asking for more (or for no
  # limit) is lowered to this and reported as capped. Rendered as
  # K4A_INDEX_MAX_SEARCH_LIMIT; the default matches the k4a client's own cap.
  maxSearchLimit: 10000
  # Follow allowlist — the v1 authorization boundary (design doc §Security).
  # REQUIRED: the chart refuses to render without it.
  #
  # The daemon follows a topic ON DEMAND the first time it's searched, but ONLY
  # if it matches one of these glob patterns (default-deny). Keep it in step
  # with the topic grants on the daemon's Kafka identity (IAM policy or ACLs) —
  # the identity can only read those topics anyway, and the allowlist keeps a
  # sensitive topic from being followed even if the grant were ever widened.
  # Comma-separated (the flag is a repeatable list; K4A_INDEX_ALLOW splits on
  # ","), e.g.
  #   allow: example.ingest.*,quotes-*-book
  allow: ""
  # Topics to pre-follow (warm + pinned, exempt from LRU eviction) at startup, so
  # a hot topic is indexed before the first search. Comma-separated; each MUST
  # match `allow`. Empty = purely demand-driven.
  prefollow: ""
  # Compacted Kafka topic that holds the follow-set, shared by every pod and
  # replica (design doc §Follow-set persistence across pods). Empty keeps it
  # only in a file on the emptyDir, which survives a container restart but not
  # a new pod: after a reschedule, upgrade or scale-up the new pod follows only
  # `prefollow` until searches warm the rest, and replicas follow different
  # sets. Set it (e.g. k4a-index.followset) and the daemon creates the topic
  # compacted if it is missing, writes each follow and its last use there,
  # reads it on startup and tails it, so a new pod re-follows what the
  # deployment followed and a replica follows what another one started. The
  # daemon's Kafka identity then also needs Read and Write on this topic (on
  # MSK IAM: kafka-cluster:ReadData, WriteData and DescribeTopic), plus Create
  # unless you create it yourself with cleanup.policy=compact. If it cannot be
  # opened the daemon logs an error and keeps the local file. Rendered as
  # K4A_INDEX_FOLLOWSET_TOPIC.
  followSetTopic: ""
  # Hard cap on concurrently-followed topics; at the cap a new follow evicts the
  # coldest. Bounds consumer connections + emptyDir disk.
  maxFollowed: 256
  # Drop a topic not searched within this idle window (LRU). Pinned pre-follow
  # topics are exempt. Go duration string. 48h rather than the 168h daemon
  # default: an idle topic's index holds disk the whole time (measured ~3x its
  # logical cap on disk — scorch defers segment reclamation), and re-following
  # costs one scanned search plus ~1s of warm-up. Disk is the scarcer resource.
  evictAfter: 48h
  # History a newly followed topic indexes before its live tail: the records
  # of the last `window`, at most `maxRecords` across its partitions (split
  # evenly; a partition with more starts later). topicMaxBytes still trims on
  # top. While it runs the coverage frame reports backfilling and queries
  # reaching "now" fall to a scan. window "0" keeps the old start (the most
  # recent ~100 records). Rendered as K4A_INDEX_BACKFILL_WINDOW /
  # K4A_INDEX_BACKFILL_MAX_RECORDS.
  backfill:
    window: 24h
    maxRecords: 1000000
  # Per-topic index byte cap: once a followed topic's index exceeds this, the
  # daemon trims its OLDEST records inline (advancing the covered window forward)
  # so a high-volume topic can't fill the emptyDir and evict the pod. Human size
  # (1GiB, 512MB, …); "0" disables. Raise this and `storage.sizeLimit` together
  # for a longer searchable window.
  #
  # 512MiB rather than the 1GiB daemon default, for two measured reasons:
  #   - DISK. The cap counts STORED bytes; on disk a topic runs ~3x that while
  #     scorch holds unreclaimed segments (~2.8GB on disk under a 1GiB cap). So
  #     budget ~1.5GB of the 10Gi emptyDir per hot topic — about 6
  #     concurrently-hot topics, versus ~3 at 1GiB.
  #   - MERGE DURATION. Worst-case merge size scales with the cap, and an
  #     unfinishable merge is what wedges a drain. A smaller cap bounds the stall.
  # These indexes answer "is X flowing / find this record now"; for a
  # long-horizon history, archive the topic elsewhere rather than growing the
  # hot index.
  topicMaxBytes: 512MiB
  # Drain-stall watchdog. The daemon's defaults are 5m / 30m / 3; they are
  # templated here so they can be retuned per install without a code release.
  drainStall:
    # Fail fast if a topic's drain makes no progress this long while records are
    # queued: dump every goroutine stack to stderr and exit. 0 disables.
    timeout: 5m
    # Tolerate a stall up to this long while a scorch segment merge is actually
    # in flight — the merger is working, and killing it restarts the merge from
    # scratch on the same (pod-scoped) emptyDir, which turns the watchdog into a
    # restart livelock. 0 disables the grace.
    #
    # With the CPU request above a capped-topic merge finishes in minutes, so
    # 10m rarely binds and a genuine hang is caught 3x sooner than the 30m code
    # default. If the CPU request is ever lowered, raise this in the same change.
    mergeGrace: 10m
    # On the Nth consecutive stall exit for the same topic index (counted in a
    # file inside the index dir, so it survives container restarts), quarantine
    # that index before exiting — the next container boots onto a fresh dir and
    # re-warms from Kafka. 0 disables. Worst case to self-heal is
    # N x (timeout + mergeGrace).
    wipeAfter: 3
  # Disk budget for the WHOLE index root, measured on disk. Nothing else bounds
  # the total: topicMaxBytes is per-topic and counts STORED bytes (on disk a
  # topic runs ~3x that), maxFollowed bounds the topic COUNT, and evictAfter
  # bounds IDLE TIME. Without this the only backstop is the kubelet evicting
  # the pod when the emptyDir hits storage.sizeLimit.
  #
  # Over budget the daemon deletes orphaned index dirs first (free — nothing
  # owns them), then evicts the coldest non-pinned topics until it fits. So a
  # busy day costs the coldest coverage instead of the whole service.
  #
  # 7GiB against a 10Gi sizeLimit leaves headroom for scorch merge scratch and
  # for the gap between two one-minute sweeps. Raise both together.
  maxTotalBytes: 7GiB
