# Default values for k4a-mcp. Set image.repository/tag to wherever you push the
# `mcp` target of the repo-root Dockerfile.
#
# k4a-mcp is stateless: it holds no index and no Kafka client, it just proxies
# MCP tool calls to k4a-index over gRPC, and it serves MCP in the go-sdk's
# Stateless mode, so no Mcp-Session-Id is issued and no session lives in pod
# memory. Any replica can answer any request: scale replicas freely, with no
# sticky routing needed.
replicaCount: 1

# Resource names default to "<release>-k4a-mcp", or just the release name when
# it already contains "k4a-mcp" (so `helm install k4a-mcp` keeps the bare name
# "k4a-mcp"). fullnameOverride pins the name outright.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# k4a-mcp needs no cloud credentials — it never talks to Kafka — so nothing
# needs to be bound to this ServiceAccount. annotations are there for
# platform conventions that expect them (IRSA, workload identity, policy
# tooling). Empty name = the chart fullname.
serviceAccount:
  name: ""
  annotations: {}

service:
  # MCP streamable-HTTP. The Service is ClusterIP; expose it to MCP clients
  # with an internal LoadBalancer or Ingress that terminates TLS.
  port: 9501

# Rendered as K4A_MCP_LOG_LEVEL: debug, info, warn, error.
logLevel: info

# On SIGTERM k4a-mcp drains in-flight HTTP requests for up to 5s; the kubelet
# kills it after this many seconds.
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532        # distroless nonroot
  runAsGroup: 65532
  fsGroup: 65532          # so the nonroot process can read mounted Secrets (mode 0440)
  seccompProfile:
    type: RuntimeDefault

# k4a-mcp writes nothing to disk; /tmp is a small emptyDir in case anything
# ever needs a scratch file under the read-only root filesystem.
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

tmpSizeLimit: 16Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Caller authentication on the MCP HTTP listener. Off by default, which keeps
# an upgraded install serving plaintext with no caller credential (k4a-mcp
# logs a warning saying so). This authenticates "a caller holding the
# deployment's credential"; listener.authz below authorizes per caller
# (SECURITY.md).
listener:
  # Serve HTTPS from an existing kubernetes.io/tls Secret, mounted at
  # /etc/k4a/listener-tls; the probes switch to HTTPS. A renewed certificate
  # is picked up without a restart.
  tls:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    # A CA key in the same Secret (e.g. ca.crt) to require client
    # certificates on every request but /health (mTLS).
    clientCAKey: ""
  # Bearer token every request but /health must present (Authorization:
  # Bearer <token>), from an existing Secret mounted at
  # /etc/k4a/listener-token. Read at startup: restart after rotating it.
  token:
    existingSecret: ""
    key: token
  # Per-caller authorization (--authz-policy, SECURITY.md). Off by default:
  # every authenticated caller reaches every topic k4a-index answers for. Once a policy is set it is
  # default-deny: a caller its entries do not name is refused, and a named
  # caller reaches only the topics its entries grant. Give the policy inline
  # (rendered into a ConfigMap; changing it rolls the pods) or name an
  # existing ConfigMap holding it under `key`. The policy holds SHA-256 hashes
  # of tokens, never the tokens. Certificate entries need
  # listener.tls.clientCAKey; token entries replace listener.token. Example:
  #   policy:
  #     callers:
  #       - name: payments-oncall
  #         cert: {cn: payments-oncall}   # or san: ..., or subject: "CN=...,O=..."
  #         search: ["payments.*"]
  #         follow: ["payments.*"]
  #       - name: ci
  #         tokenSHA256: <sha256 of the token, e.g. printf %s "$TOKEN" | sha256sum>
  #         search: ["telemetry.*"]
  authz:
    policy: {}
    existingConfigMap: ""
    key: policy.yaml


# What k4a-mcp presents to k4a-index, for a k4a-index whose listener asks
# for credentials (its listener.* values). Default: plaintext, no token.
index:
  tls:
    # Dial k4a-index over TLS. Required for a token: k4a-mcp refuses to send
    # one over plaintext.
    enabled: false
    # Existing Secret mounted at /etc/k4a/index-tls holding the CA that signed
    # k4a-index's certificate and, for mTLS, a client certificate and key.
    # Empty keys are skipped; an empty existingSecret means the system roots.
    existingSecret: ""
    caKey: ca.crt
    certKey: ""
    keyKey: ""
  token:
    # Existing Secret holding k4a-index's bearer token, mounted at
    # /etc/k4a/index-token.
    existingSecret: ""
    key: token

config:
  # In-cluster gRPC endpoint of the k4a-index daemon. Same namespace, so the
  # short Service name resolves; the default matches a k4a-index release named
  # "k4a-index" (otherwise its Service is "<release>-k4a-index"); ClusterIP, plaintext (the TLS edge is for
  # external MCP clients hitting k4a-mcp, not this hop).
  indexAddr: k4a-index:9500
  # HTTP path the MCP endpoint is served at. Clients register
  #   claude mcp add --transport http k4a-index https://<k4a-mcp-host>/mcp
  path: /mcp

# Optional NetworkPolicy, default off. Admits ingress to the HTTP port only.
networkPolicy:
  enabled: false
  # NetworkPolicyPeer list allowed to reach the HTTP port; empty = any source
  # (still only on that port). A load balancer that targets pod IPs reaches
  # the pod from non-pod addresses, so admit its subnets with an ipBlock.
  ingressFrom: []
  # NetworkPolicyEgressRule list. Empty = egress is not restricted. If you set
  # it, allow DNS and the k4a-index gRPC port.
  egress: []

# Optional PodDisruptionBudget, default off. With replicaCount 1 and
# minAvailable 1 a node drain blocks until you intervene, so raise
# replicaCount first or use maxUnavailable. maxUnavailable wins when set.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""
