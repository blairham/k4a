name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain posture — branch
# protection, pinned dependencies, SAST, signed releases — and publishes the
# result for the README badge.
#
# Rendered from blairham/.github baseline/scorecard.yml.tmpl by `make sync`.
# Not a reusable workflow: publish_results only accepts a workflow that runs
# in the repository it grades.
#
# ⚠ publish_results imposes restrictions on this workflow: no workflow- or
# job-level `env:` or `defaults:`, no containers or services, and only the
# actions used below. Anything else and the results are not published.
on:
  branch_protection_rule:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
  # A rename can make GitHub drop push events for a while, leaving the badge
  # with no result until the weekly cron; this re-runs it by hand.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
