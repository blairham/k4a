name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1). Must already exist."
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the image on ghcr.io
      id-token: write # keyless cosign and provenance signing
      attestations: write # store the provenance in the repository's attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
          cache: false # replaced by the release-scoped cache below

      # Saved after goreleaser, so it warms every cross-compiled target.
      - name: Restore release Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-release-${{ runner.os }}-

      - name: Checkout tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "refs/tags/${{ inputs.tag }}"

      - name: Run tests
        run: make test

      # The notes are the tag's section of CHANGELOG.md; a release whose
      # section is missing fails here rather than publishing empty notes.
      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on                    { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # The charts install the image of their appVersion; a stale chart would
      # pin the previous release.
      - name: Confirm the charts name this version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          status=0
          for c in k4a-index k4a-mcp; do
            chart="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "charts/$c/Chart.yaml")"
            if [ "$chart" != "${TAG#v}" ]; then
              echo "::error::charts/$c/Chart.yaml appVersion is $chart but the tag is $TAG; bump the chart and re-tag"
              status=1
            fi
          done
          exit "$status"

      # The default docker driver cannot push a multi-arch manifest list.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained token with contents:write on blairham/homebrew-tap only.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # SLSA provenance for every archive in checksums.txt, also attached to the
      # release as .intoto.jsonl. Not slsa-github-generator, which cannot be
      # pinned to a SHA.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Image provenance, on each multi-arch index digest as GoReleaser recorded
      # it (not re-resolved from the registry). Anything but exactly one digest
      # per image fails the release.
      - name: Find the image digests
        id: image
        run: |
          set -euo pipefail
          for img in k4a-index k4a-mcp; do
            digests="$(jq -r --arg ref "ghcr.io/blairham/$img:" '
              [.[] | select(.name | startswith($ref))]
              | (map(select(.type == "Docker Manifest")) | if length > 0 then . else empty end)
                // map(select(.type == "Docker Image"))
              | map(.extra.Digest // empty) | unique | .[]
            ' dist/artifacts.json)"
            count="$(printf '%s' "$digests" | grep -c '^sha256:[0-9a-f]\{64\}$' || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::expected one $img digest in dist/artifacts.json, found $count: ${digests:-none}"
              exit 1
            fi
            echo "${img#k4a-}=$digests" >> "$GITHUB_OUTPUT"
          done

      - name: Attest k4a-index provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blairham/k4a-index
          subject-digest: ${{ steps.image.outputs.index }}
          push-to-registry: true

      - name: Attest k4a-mcp provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blairham/k4a-mcp
          subject-digest: ${{ steps.image.outputs.mcp }}
          push-to-registry: true

      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/k4a-$TAG.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/k4a-$TAG.intoto.jsonl" --clobber
