name: CI

# Everything that gates a merge. Pre-commit, Detect changed files, Build and
# test and Fuzz are blairham/.github's go-ci.yml, and the Dockerfile check is
# its go-image.yml; their checks report as `CI / <job>` and
# `Image / Build image`. The Helm chart job is this repository's own. Both
# `needs: changes` (go-changes.yml, so they need not wait for all of go-ci)
# and gate their steps on `needs.changes.outputs.code == 'true'` (never a
# job-level `if:` or a `paths:` filter: a required check that never runs is
# pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request built, so main gets its own run.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request, and for Image from source.
    - cron: '53 5 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@2a975269ebbb74aa0b4ec96f45773d7d68cc7bcc # v0.0.3
    with:
      # All three binaries, and the generated gRPC code current. The tests
      # include every fuzz target's seed corpus; no Kafka needed.
      build-command: make build && make check-proto && go vet ./...

  changes:
    name: Changes
    uses: blairham/.github/.github/workflows/go-changes.yml@2a975269ebbb74aa0b4ec96f45773d7d68cc7bcc # v0.0.3
    with:
      filters: '{"dockerfile": ["^Dockerfile$", "^\\.dockerignore$"]}'

  # Build only; the release publishes (release.yml). The release's own
  # GoReleaser snapshot, publishing and signing nothing: the `*-release` stages
  # .goreleaser.yaml names, which start from the distroless runtime and COPY
  # GoReleaser's binaries, so the Go image on public.ecr.aws is never pulled.
  # That pull is anonymous from runners that share egress addresses, and
  # public ECR answered it with 429s often enough to fail this required check.
  image:
    name: Image
    needs: changes
    uses: blairham/.github/.github/workflows/go-image.yml@2a975269ebbb74aa0b4ec96f45773d7d68cc7bcc # v0.0.3
    with:
      run: ${{ needs.changes.outputs.code == 'true' }}
      builder: goreleaser

  # The from-source targets `make docker-build` uses, which nothing above
  # builds: on a pull request that changes the Dockerfile (Dependabot's
  # golang base bumps among them) and weekly. Not a required check, so it
  # may be skipped at the job level, and a 429 here is a rerun, not a block.
  image-source:
    name: Image from source
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.matches).dockerfile == 'true')
    uses: blairham/.github/.github/workflows/go-image.yml@2a975269ebbb74aa0b4ec96f45773d7d68cc7bcc # v0.0.3
    with:
      # Both images, one after the other: the second shares the build stage,
      # so it is mostly cache.
      targets: '["index", "mcp"]'

  # Lints both charts and renders them, including that k4a-index still refuses
  # to render without an allowlist.
  charts:
    name: Helm chart
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: needs.changes.outputs.code == 'true'
      - name: Lint and render
        if: needs.changes.outputs.code == 'true'
        run: make helm-lint
