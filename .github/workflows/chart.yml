name: Publish charts

# Publishes charts/k4a-index and charts/k4a-mcp to oci://ghcr.io/blairham/charts
# and signs each by digest, keyless, through blairham/.github's go-chart.yml,
# so a consumer can `helm install`/`helm template` a pinned version without
# cloning the repository. The images are published by release.yml; these are
# the charts that install them. go-chart.yml refuses a chart whose `version`
# or `appVersion` does not match the tag.
#
# release-please.yml calls it beside release.yml when the release pull request
# merges. A separate workflow, not a step in release.yml, so a tag whose
# charts failed can be published by hand without re-running a release whose
# GitHub release and images already exist:
#   gh workflow run chart.yml -f tag=v0.0.0
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag whose charts to publish (e.g. v0.1.0). Must already exist."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose charts to publish (e.g. v0.0.0). Must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Charts
    permissions:
      contents: read
      packages: write # the charts on ghcr.io
      id-token: write # keyless cosign
    uses: blairham/.github/.github/workflows/go-chart.yml@2a975269ebbb74aa0b4ec96f45773d7d68cc7bcc # v0.0.3
    with:
      tag: ${{ inputs.tag }}
      charts: '["k4a-index", "k4a-mcp"]'
