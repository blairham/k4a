# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Rendered from blairham/.github baseline/dependabot.yml.tmpl by `make sync`.
# Groups are derived from go.mod: a group appears when the module requires
# something it covers. The docker ecosystem appears when there is a Dockerfile.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # aws-sdk-go-v2 releases its modules together; one PR, not six.
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      # kgo, kadm and kmsg are versioned separately but released together.
      franz-go:
        patterns:
          - "github.com/twmb/franz-go*"
      # The Charm stack (bubbletea, bubbles, lipgloss) and tuikit, which builds
      # on it, move as one line.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
          - "github.com/blairham/tuikit"
      # Generated gRPC code is tied to both modules.
      grpc:
        patterns:
          - "google.golang.org/grpc"
          - "google.golang.org/protobuf"
  # Bumps the SHA pins and their `# vX.Y.Z` comments together, including the
  # pin on blairham/.github's reusable workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A Go minor bump moves go.mod and .tool-versions by hand, not as a lone
      # Dockerfile bump. Digest and patch updates still come through.
      - dependency-name: docker/library/golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
